version: '3.8'

services:
  telegram-mail-bot:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: telegram-mail-bot
    restart: always
    volumes:
      - ./.env:/workdir/.env
      - ./conf:/workdir/conf
      - ./logs:/workdir/logs
      - .:/workdir/src
    tty: true
    stdin_open: true
